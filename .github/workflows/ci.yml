name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      release:
        description: Whether this is running as part of a release workflow.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash

env:
  GOVERSION: "1.26"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            lint: true
          - os: ubuntu-latest
            goos: linux
            lint: true
          - os: macos-latest
            goos: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go ${{ env.GOVERSION }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GOVERSION }}
          cache: false
      - name: Test
        run: GOOS=${{ matrix.goos }} go test ./... -cover -v
      - name: Smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: ./tests/test.sh
  check:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    needs:
      - test
    steps:
      - name: Check
        run: |
          if [[ "${{ needs.test.result }}" == "success" ]]; then
            echo -e "\e[32mSuccess\e[0m"
          else
            echo -e "\e[31mFailed\e[0m"
            exit 1
          fi
